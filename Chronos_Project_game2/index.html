<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Chronos Project: Son Döngü</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cinema.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/story.css">
</head>
<body>
<canvas id="window"></canvas>
<div id="app">
  <header><h1>CHRONOS PROJECT<span>SON DÖNGÜ</span></h1><div id="guide"></div></header>

  <aside id="left">
    <section class="panel" id="crew"></section>
    <section class="panel" id="core"></section>
    <details class="panel drawer" id="legacyDrawer"><summary>Geçmişteki görevler <span id="legacyCount">0</span></summary><div id="drops"></div></details>
    <section id="view"><span>GÖZLEM PENCERESİ</span><small id="viewTxt"></small></section>
  </aside>

  <main>
    <section class="panel" id="ops">
      <div class="ptitle"><b>OPERASYON MERKEZİ</b><span id="yearLabel">2070</span>
        <div class="tabs"><button id="btnBridge">Gemi</button><button id="btnMute">Ses: Açık</button> <button id="btnBook">Tarih Kitabı</button> <button id="btnAch">Başarımlar</button></div></div>
      <div id="pulse" aria-label="Dünya Nabzı: hedefleri besleyen göstergeler"></div>
      <div id="mapWrap"><svg id="map"></svg><div id="mapLegend"></div></div>
      <div id="ticker"></div>
    </section>
    <section class="panel" id="timeline">
      <div class="ptitle"><b>ZAMAN ÇİZELGESİ</b><span id="tlHint">Bir çağa tıklayıp o yılın dünyasına bak</span></div>
      <div id="tlBar"></div>
      <div class="shiftBar" id="shiftBar"></div>
      <div class="tlBtns"><button id="btnJump" class="primary">SIÇRAMA HAZIRLIĞI</button><button id="btnSave">Kaydet</button><button id="btnEnd" class="ghost">Döngüyü bitir</button></div>
      <p id="saveStatus" role="status"></p>
    </section>
  </main>

  <aside id="right">
    <section class="panel" id="proto"></section>
    <details class="panel drawer" id="cardDrawer"><summary>Karar kartları <span id="cardCount">2</span></summary><div id="hand"></div></details>
    <details class="panel drawer" id="dataDrawer"><summary>Dünya verileri <span>15</span></summary><div id="pool"></div></details>
  </aside>
</div>
<div id="modal" class="hidden" role="dialog" aria-modal="true"><div id="modalBox" tabindex="-1"></div></div>
<script src="src/map-data.js"></script>
<script src="src/data.js"></script>
<script src="src/content.js"></script>
<script src="src/sim.js"></script>
<script src="src/game.js"></script>
<script src="src/experience.js"></script>
<script src="src/scene-data.js"></script>
<script src="src/save.js"></script>
<script src="src/scene-audio.js"></script>
<script src="src/hud.js"></script>
<script src="src/narrative.js"></script>
<script src="src/cinema.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
